[project]
name = "devkit-fixture"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "vulture", "pip-audit", "uv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
ignore_names = ["test_*"]
