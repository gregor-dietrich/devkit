# make audit runs npm audit over the markdown and jscpd closures' lockfiles
# (#58). ci.yml's audit job runs it on every pull request and every push to
# main; this workflow runs it weekly, so an advisory published against a
# pinned version is seen while no pull request is open. It is apart from
# ci.yml so the schedule does not rerun the java and python parts.
# Actions are pinned by commit SHA; the comment names the tag it resolved from.
name: audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here needs the token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # its npm audits the lockfiles; no closure is installed
          check-latest: true # not an older 22.x the runner has cached
      - run: apt-get update -qq && apt-get install -y -qq make
      - run: make audit
